<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#tspGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Architectural Tensile Membrane Geometry -->
  <!-- Left curved sail wing -->
  <path d="M12 50 C20 34, 28 22, 32 12 C30 26, 22 42, 12 50 Z" 
        fill="url(#goldGrad)" opacity="0.95"/>
        
  <!-- Right curved sail wing -->
  <path d="M52 50 C44 34, 36 22, 32 12 C34 26, 42 42, 52 50 Z" 
        fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Center Hyperbolic Paraboloid Saddle Curve -->
  <path d="M16 48 C24 40, 40 40, 48 48 C38 43, 26 43, 16 48 Z" 
        fill="#F8FAFC" opacity="0.95"/>

  <!-- Main Structural Mast / Pylon -->
  <line x1="32" y1="10" x2="32" y2="52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Mast Top Finial Point -->
  <circle cx="32" cy="10" r="2.5" fill="#FBBF24"/>

  <!-- High-tension rigging cable lines -->
  <line x1="32" y1="14" x2="12" y2="50" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="32" y1="14" x2="52" y2="50" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" stroke-opacity="0.85"/>
  <line x1="32" y1="28" x2="20" y2="48" stroke="#FBBF24" stroke-width="1" stroke-dasharray="2 1.5" stroke-opacity="0.7"/>
  <line x1="32" y1="28" x2="44" y2="48" stroke="#FBBF24" stroke-width="1" stroke-dasharray="2 1.5" stroke-opacity="0.7"/>

  <!-- Base Anchor Points -->
  <circle cx="12" cy="50" r="2" fill="#E2E8F0"/>
  <circle cx="52" cy="50" r="2" fill="#E2E8F0"/>
  <circle cx="32" cy="52" r="2" fill="#E2E8F0"/>
</svg>
